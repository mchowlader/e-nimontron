<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <linearGradient id="palkiGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="palkiRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
  </defs>
  <!-- Long Carrying Pole (দণ্ড) -->
  <path d="M 4 36 C 30 38, 90 38, 116 36 L 116 33 C 90 35, 30 35, 4 33 Z" fill="url(#palkiGold)" stroke="#78350f" stroke-width="0.7" />
  <!-- Palki Roof / Canopy Dome -->
  <path d="M 38 34 C 42 20, 78 20, 82 34 Z" fill="url(#palkiRed)" stroke="url(#palkiGold)" stroke-width="1.5" />
  <!-- Top Finial / Kalash -->
  <path d="M 60 16 L 60 21 M 58 20 L 62 20" stroke="url(#palkiGold)" stroke-width="2" />
  <circle cx="60" cy="16" r="2.5" fill="url(#palkiGold)" />
  <!-- Main Cabin Box -->
  <rect x="36" y="34" width="48" height="32" rx="4" fill="#7f1d1d" stroke="url(#palkiGold)" stroke-width="1.8" />
  <!-- Arch Window / Curtain -->
  <path d="M 46 62 L 46 44 C 46 38, 74 38, 74 44 L 74 62 Z" fill="#450a0a" stroke="url(#palkiGold)" stroke-width="1.2" />
  <!-- Golden tassels hanging on curtain -->
  <path d="M 48 44 C 54 50, 66 50, 72 44" fill="none" stroke="url(#palkiGold)" stroke-width="1.2" />
  <!-- Decorative Legs / Base Stand -->
  <path d="M 40 66 L 38 72 M 80 66 L 82 72" stroke="url(#palkiGold)" stroke-width="2" stroke-linecap="round" />
  <circle cx="38" cy="72" r="2" fill="url(#palkiGold)" />
  <circle cx="82" cy="72" r="2" fill="url(#palkiGold)" />
</svg>

