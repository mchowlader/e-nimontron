<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <!-- Bamboo Grain & Golden Hue -->
    <linearGradient id="kulaBamboo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="kulaRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="kulaShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#kulaShadow)">
    <!-- Outer Bamboo Winnowing Fan Rim (Horseshoe Arch) -->
    <path d="M 20 120 C 12 70, 24 18, 70 18 C 116 18, 128 70, 120 120 L 110 120 C 116 75, 108 26, 70 26 C 32 26, 24 75, 30 120 Z" fill="url(#kulaBamboo)" stroke="#78350f" stroke-width="1.2" />

    <!-- Braided Binding on Arch -->
    <path d="M 20 120 C 12 70, 24 18, 70 18 C 116 18, 128 70, 120 120" fill="none" stroke="#78350f" stroke-width="2.5" stroke-dasharray="2,3" />

    <!-- Inner Tray Base Surface -->
    <path d="M 28 118 C 24 75, 32 26, 70 26 C 108 26, 116 75, 112 118 Z" fill="url(#kulaRed)" stroke="url(#kulaBamboo)" stroke-width="1.5" />

    <!-- Woven Bamboo Texture Lines -->
    <line x1="40" y1="45" x2="100" y2="45" stroke="#7f1d1d" stroke-width="1" />
    <line x1="36" y1="65" x2="104" y2="65" stroke="#7f1d1d" stroke-width="1" />
    <line x1="33" y1="85" x2="107" y2="85" stroke="#7f1d1d" stroke-width="1" />
    <line x1="31" y1="105" x2="109" y2="105" stroke="#7f1d1d" stroke-width="1" />

    <!-- Auspicious Swastika / Alpona in Center -->
    <g transform="translate(70, 70) scale(0.85)">
      <!-- Central Auspicious Swastika in White Alpona -->
      <path d="M -16 0 L 16 0 M 0 -16 L 0 16 M -16 0 L -16 -10 M 16 0 L 16 10 M 0 -16 L 10 -16 M 0 16 L -10 16" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-8" cy="-8" r="2" fill="#fff" />
      <circle cx="8" cy="-8" r="2" fill="#fff" />
      <circle cx="-8" cy="8" r="2" fill="#fff" />
      <circle cx="8" cy="8" r="2" fill="#fff" />
    </g>

    <!-- Dhan (Rice Paddy Stalk) and Durba Grass Accent -->
    <path d="M 38 116 C 45 95, 60 88, 70 92" fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="50" cy="100" r="2" fill="#fde047" />
    <circle cx="58" cy="94" r="2" fill="#fde047" />
    <circle cx="66" cy="92" r="2" fill="#fde047" />

    <!-- Sacred Diya (মঙ্গল প্রদীপ) on Kula -->
    <path d="M 60 114 C 62 108, 78 108, 80 114 Z" fill="#b45309" stroke="#78350f" stroke-width="1" />
    <!-- Flame -->
    <path d="M 70 102 C 67 106, 68 110, 70 110 C 72 110, 73 106, 70 102 Z" fill="#f97316" />
    <circle cx="70" cy="107" r="1.5" fill="#fef08a" />
  </g>
</svg>

