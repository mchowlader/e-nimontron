<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <!-- Wood / Lacquer Red Gradient -->
    <linearGradient id="piriWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#580f15" />
    </linearGradient>
    <!-- Gold Trim Gradient -->
    <linearGradient id="piriGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="stickerShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#stickerShadow)">
    <!-- Wooden Piri Legs / Feet -->
    <rect x="22" y="80" width="16" height="14" rx="3" fill="#450a0a" stroke="url(#piriGold)" stroke-width="1.2" />
    <rect x="122" y="80" width="16" height="14" rx="3" fill="#450a0a" stroke="url(#piriGold)" stroke-width="1.2" />

    <!-- 3D Piri Thickness / Rim -->
    <path d="M 12 60 L 148 60 L 144 82 L 16 82 Z" fill="#5c0d16" stroke="url(#piriGold)" stroke-width="1" />

    <!-- Piri Top Surface (Isometric Ellipse / Trapezoid) -->
    <path d="M 28 26 L 132 26 L 148 62 L 12 62 Z" fill="url(#piriWood)" stroke="url(#piriGold)" stroke-width="2" />

    <!-- Outer Gold / White Pearl Border -->
    <path d="M 32 30 L 128 30 L 142 58 L 18 58 Z" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="3,2" />

    <!-- Central Traditional Bengali Alpona (পদ্ম ও ময়ূর কল্কা) -->
    <!-- Lotus Center -->
    <circle cx="80" cy="44" r="10" fill="#fff" fill-opacity="0.9" />
    <circle cx="80" cy="44" r="5" fill="#b91c1c" />

    <!-- Lotus Petals (Alpona) -->
    <path d="M 80 30 C 76 36, 84 36, 80 30 Z" fill="#fff" />
    <path d="M 80 58 C 76 52, 84 52, 80 58 Z" fill="#fff" />
    <path d="M 66 44 C 72 40, 72 48, 66 44 Z" fill="#fff" />
    <path d="M 94 44 C 88 40, 88 48, 94 44 Z" fill="#fff" />

    <!-- Diagonal Petals -->
    <path d="M 70 34 C 74 38, 77 35, 70 34 Z" fill="#fff" />
    <path d="M 90 34 C 86 38, 83 35, 90 34 Z" fill="#fff" />
    <path d="M 70 54 C 74 50, 77 53, 70 54 Z" fill="#fff" />
    <path d="M 90 54 C 86 50, 83 53, 90 54 Z" fill="#fff" />

    <!-- Kalka swirls on left & right -->
    <path d="M 40 44 C 44 34, 56 38, 52 48 C 50 54, 42 52, 44 44" fill="none" stroke="#fff" stroke-width="1.6" />
    <circle cx="48" cy="42" r="2" fill="url(#piriGold)" />

    <path d="M 120 44 C 116 34, 104 38, 108 48 C 110 54, 118 52, 116 44" fill="none" stroke="#fff" stroke-width="1.6" />
    <circle cx="112" cy="42" r="2" fill="url(#piriGold)" />

    <!-- Side Handles (হাতা) -->
    <path d="M 10 46 C 4 46, 4 54, 10 54" fill="none" stroke="url(#piriGold)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 150 46 C 156 46, 156 54, 150 54" fill="none" stroke="url(#piriGold)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>

